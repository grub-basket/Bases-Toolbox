name: Release

on:
  push:
    branches: [main]
    paths: ["manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Verify versions.json covers this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -f versions.json ]; then
            echo "::error::versions.json is missing — the store cannot map $VERSION to a minAppVersion."
            exit 1
          fi
          if ! jq -e . versions.json >/dev/null 2>&1; then
            echo "::error::versions.json is not valid JSON."
            exit 1
          fi
          MIN=$(jq -r '.minAppVersion' manifest.json)
          MAPPED=$(jq -r --arg v "$VERSION" '.[$v] // empty' versions.json)
          if [ -z "$MAPPED" ]; then
            echo "::error::versions.json has no entry for $VERSION. Add \"$VERSION\": \"$MIN\" to versions.json and push again."
            exit 1
          fi
          if [ "$MAPPED" != "$MIN" ]; then
            echo "::error::versions.json maps $VERSION -> $MAPPED but manifest.minAppVersion is $MIN."
            exit 1
          fi
          echo "versions.json OK: $VERSION -> $MAPPED"

          # Historical rot: warn, don't block — an old unmapped tag is not this
          # release's fault, but it should still be visible.
          MISSING=""
          N=0
          for tag in $(git tag | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'); do
            N=$((N + 1))
            jq -e --arg v "$tag" 'has($v)' versions.json >/dev/null 2>&1 || MISSING="$MISSING $tag"
          done
          # Report the count: a silently-empty tag list would otherwise be
          # indistinguishable from "all tags mapped", making this check dead code.
          echo "checked $N release tag(s) against versions.json"
          if [ "$N" -eq 0 ]; then
            echo "::warning::no release tags visible — tag coverage was NOT checked (needs fetch-depth: 0)."
          fi
          if [ -n "$MISSING" ]; then
            echo "::warning::released tags missing from versions.json:$MISSING"
          fi

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin
        if: steps.check.outputs.exists == 'false'
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="release-notes/${VERSION}.md"
          {
            echo "notes<<EOF"
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
            else
              PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -z "$PREV_TAG" ]; then
                LOG=$(git log --pretty=format:'- %s')
              else
                LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:'- %s')
              fi
              echo "## Changes since ${PREV_TAG:-the beginning}"
              echo ""
              echo "$LOG"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release and upload plugin assets
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          gh release upload "$TAG" main.js manifest.json styles.css --clobber
